[project]
name = "fastapi-questions"
version = "0.1.0"
description = "API de preguntas con FastAPI y Hugging Face"
authors = [
    {name = "lauchatt",email = "pablogomezj11@gmail.com"}
]
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi (>=0.136.1,<0.137.0)",
    "uvicorn (>=0.46.0,<0.47.0)",
    "sqlalchemy (>=2.0.49,<3.0.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "pandas (>=3.0.3,<4.0.0)",
    "pyarrow (>=24.0.0,<25.0.0)",
    "requests (>=2.34.0,<3.0.0)",
    "transformers (>=5.14.1,<6.0.0)",
    "torch (>=2.13.0,<3.0.0)",
    "sentence-transformers (>=5.6.1,<6.0.0)",
    "scikit-learn (>=1.9.0,<2.0.0)",
    "tqdm (>=4.70.0,<5.0.0)",
    "datasets (>=5.0.1,<6.0.0)",
    "accelerate (>=1.14.0,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)"
]

[tool.poetry]
package-mode = false